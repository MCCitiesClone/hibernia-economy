name: Jobs · Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'jobs/**'
      - 'common/**'          # implementation(project(":common")) — DataSourceProvider
      - 'common-paper/**'    # implementation(project(":common-paper")) — TagAwareMessage
      - '.github/workflows/jobs-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'jobs/**'
      - 'common/**'          # implementation(project(":common")) — DataSourceProvider
      - 'common-paper/**'    # implementation(project(":common-paper")) — TagAwareMessage
      - '.github/workflows/jobs-build.yml'
  workflow_dispatch:

# Least privilege (CodeQL actions/missing-workflow-permissions): build-only,
# checkout is all the GITHUB_TOKEN needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Shadow JAR
        run: ./gradlew --no-daemon :jobs:clean :jobs:shadowJar -Pci=true
