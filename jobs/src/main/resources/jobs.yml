# =============================================================================
# Jobs, licences and qualifications.
#
# LuckPerms groups are the SOURCE OF TRUTH for who holds what. This file only
# declares which groups are job groups, how they are presented, and who may hire
# into and fire from them. A declared group that does not exist in LuckPerms is
# created on startup and after /jobs reload.
#
# The types below ship with no jobs on purpose. On a version upgrade the framework
# merges any keys missing from your file back in from the jar defaults; if example
# jobs shipped here, ones you had deliberately deleted would silently reappear. Add
# your own jobs under each type — see the fully worked example at the bottom.
#
# Removing a job from this file does NOT delete its LuckPerms group or revoke it
# from anyone. That is deliberate: destroying permissions as a side effect of a
# config edit would be a bad property. Its mirror rows are simply no longer
# reconciled, and `/jobs audit external` will surface them.
# =============================================================================

# Permission node that bypasses the can-manage hierarchy entirely. Point this at an
# existing staff node if you already have one (you must then declare that node
# yourself; only the default below is registered by the plugin).
admin-permission: "jobs.admin"

# Create any declared LuckPerms group that does not already exist, at startup and
# after every /jobs reload. Turn off if group creation is managed elsewhere.
provision-groups: true

# Show a type's section in /jobs even when the player holds none of its jobs.
show-empty-types: false

# Top-level listing commands. THIS FILE decides which exist — the key is the
# command name, so `qual:` below creates /qual. Add an entry to create a command,
# rename the key to rename it, delete it to remove it; /jobs reload applies all
# three without a restart. An entry naming a type that is not configured is
# skipped with a warning rather than registered.
#
# Every configured type is always reachable as /jobs type <type>, so an entry here
# is only needed for types that deserve their own short root.
#
#   <command-name>:
#     type:     the type key whose jobs it lists
#     aliases:  other names the command answers to
listing-commands:
  licenses:
    type: licenses
    aliases: [ license, licences, licence ]
  qual:
    type: qualifications
    aliases: [ quals, qualification, qualifications ]

# Periodic drift repair. Compares LuckPerms' real membership against this plugin's
# mirror and records the difference in the audit log. It NEVER writes to LuckPerms:
# groups granted by another plugin or by hand are recorded as 'external', not
# stripped, so two plugins can never end up write-fighting over a group.
reconciliation:
  enabled: true
  interval-seconds: 1800

# -----------------------------------------------------------------------------
# types:
#   <type-key>:
#     display-name        section header shown by /jobs
#     order               ascending sort position of the section; ties break on key
#     managed-externally  true -> player-run /hire and /fire are refused for this
#                         type. The JobsApi, the console and jobs.admin still work.
#                         Use for types another plugin owns, e.g. trades awarded by
#                         a skills plugin.
#     can-manage          selectors inherited by every job in this type
#     provision           LuckPerms metadata inherited by every job in this type
#     jobs:
#       <job-key>:
#         display-name    shown in /jobs; rename freely, history is keyed on the key
#         group           LuckPerms group name; defaults to the job key
#         description      one-line blurb shown by /jobs info
#         can-manage      selectors, UNIONed with the type's list
#         provision       overrides the type's block KEY BY KEY (permissions union)
#
# Selector grammar: "<type>/<job>", with "*" allowed on either side.
#   government/president   exactly that job
#   licenses/*             every job of type "licenses"
#   */firearms             that job key in any type
#   */*  (or just "*")     everything
# Matching is case-insensitive and NON-TRANSITIVE: holding a job that can manage a
# manager does not give you the manager's own authority.
#
# provision applies ONLY the keys you declare, on create and on every reload.
# Anything you do not declare here is never touched, so a weight you set by hand in
# LuckPerms survives. The converse also holds: a key you DO declare is reasserted on
# reload, so hand-edits to it will be overwritten.
# -----------------------------------------------------------------------------
types:

  government:
    display-name: "Government"
    order: 10
    jobs: {}

  legal:
    display-name: "Legal"
    order: 20
    jobs: {}

  professions:
    display-name: "Professions"
    order: 30
    jobs: {}

  trades:
    display-name: "Trades"
    order: 40
    # Trades are awarded by the skills plugin through the JobsApi, not by hand.
    managed-externally: true
    jobs: {}

  licenses:
    display-name: "Licences"
    order: 50
    jobs: {}

  qualifications:
    display-name: "Qualifications"
    order: 60
    jobs: {}

