# =============================================================================
# Jobs — player-facing messages (MiniMessage).
#
# Placeholders available to every message are declared as placeholder.* below and
# referenced as {name}. Per-message placeholders are noted in the comments.
#
# NOTE ON CLICKABLE ENTRIES: jobs.list.entry puts {job} inside a
# <click:run_command:'...'> argument. A tag argument is a literal string, so the
# framework's generated <phN> tag is never resolved there — that key must be sent
# with TagAwareMessage (:common-paper), which JobListRenderer does. The
# JobsTagArgumentAuditTest enforces this.
# =============================================================================

placeholder.prefix=<bold><gold>JOBS</gold></bold> <gray>»</gray>
placeholder.secbegin=<#f0b040>
placeholder.secend=</#f0b040>

# ---- Listings -------------------------------------------------------------
# {target} the player whose jobs are shown
jobs.list.header={prefix} Jobs held by {secbegin}{target}{secend}<gray>:</gray>
# {type} the section's display name
jobs.list.section=<gray>—</gray> {secbegin}{type}{secend}
jobs.list.section-empty=  <dark_gray>(none)</dark_gray>
# {name} the job's display name, {job} its type/job key (used by the click target)
jobs.list.entry=  <gray>-</gray> <click:run_command:'/jobs info {job}'><white>{name}</white></click>
# Held by inheritance from a parent rank: real authority, but /fire and /quit
# cannot remove it because there is no direct node to remove.
jobs.list.entry-inherited=  <gray>-</gray> <white>{name}</white> <dark_gray>(inherited)</dark_gray>
jobs.list.empty={prefix} {secbegin}{target}{secend} holds no jobs, licences or qualifications.
# {type} the filtered section's display name
jobs.list.type-empty={prefix} {secbegin}{target}{secend} holds no {type}.
jobs.list.type-unconfigured={prefix} <red>That listing is not configured.</red> <gray>Set listing-commands in jobs.yml.</gray>

# ---- Job information ------------------------------------------------------
jobs.info.header={prefix} {secbegin}{name}{secend} <dark_gray>({job})</dark_gray>
jobs.info.detail=<gray>  {description}</gray><br><gray>  LuckPerms group:</gray> <white>{group}</white>
# The can-manage selectors this job grants over other jobs.
jobs.info.manages=<gray>  May hire and fire:</gray> <white>{selectors}</white>

# ---- Hiring ---------------------------------------------------------------
jobs.hire.sender={prefix} Hired {secbegin}{target}{secend} as {secbegin}{job}{secend}.
jobs.hire.target={prefix} You have been hired as {secbegin}{job}{secend} by {sender}.
jobs.hire.already={prefix} <yellow>{target} already holds {job}.</yellow>

# ---- Firing ---------------------------------------------------------------
jobs.fire.sender={prefix} Removed {secbegin}{target}{secend} from {secbegin}{job}{secend}.
jobs.fire.target={prefix} You have been removed from {secbegin}{job}{secend} by {sender}.
jobs.fire.not-held={prefix} <red>{target} does not hold {job}.</red>
# The direct node was removed but a parent rank still grants the group, so the
# player still resolves as a holder. Saying nothing here would be a half-truth.
jobs.fire.still-inherited={prefix} <yellow>{target} still inherits {job} from another group — remove it from that rank in LuckPerms.</yellow>

# ---- Quitting -------------------------------------------------------------
jobs.quit.success={prefix} You have left {secbegin}{job}{secend}.
jobs.quit.not-held={prefix} <red>You do not hold {job}.</red>
jobs.quit.inherited={prefix} <red>You hold {job} through another group, so it cannot be left here.</red>

# ---- Errors ---------------------------------------------------------------
jobs.error.unknown-job={prefix} <red>No such job, licence or qualification:</red> <white>{job}</white>
jobs.error.ambiguous-job={prefix} <red>'{job}' exists in more than one type.</red> <gray>Qualify it, e.g. trades/{job}.</gray>
jobs.error.unknown-type={prefix} <red>No such type:</red> <white>{type}</white>
jobs.error.not-authorised={prefix} <red>You are not authorised to hire or fire {job}.</red>
# The type is owned by another plugin; players cannot hand-hire into it.
jobs.error.externally-managed={prefix} <red>{job} is managed by another plugin and cannot be assigned by hand.</red>
jobs.error.inherited={prefix} <red>{target} holds {job} through another group; remove it from that rank instead.</red>
jobs.error.permissions-unavailable={prefix} <red>LuckPerms is unavailable — job changes are disabled.</red>
jobs.error.backend={prefix} <red>The permission backend failed:</red> <gray>{error}</gray>
jobs.error.player-only={prefix} <red>The console holds no jobs.</red> <gray>Use /jobs fire <player> <job> instead.</gray>
jobs.error.needs-target={prefix} <red>The console must name a player.</red> <gray>Try /jobs <player>.</gray>

# ---- History and audit ----------------------------------------------------
jobs.history.header={prefix} Recent job history for {secbegin}{target}{secend}<gray>:</gray>
jobs.history.entry=  <dark_gray>{date}</dark_gray> <white>{action}</white> {secbegin}{job}{secend} <gray>by {actor}</gray>
jobs.history.empty={prefix} No job history for {secbegin}{target}{secend}.
# Memberships found in LuckPerms that this plugin did not grant.
jobs.audit.external.header={prefix} <yellow>{count}</yellow> membership(s) granted outside this plugin<gray>:</gray>
jobs.audit.external.entry=  <gray>-</gray> <white>{player}</white> {secbegin}{job}{secend} <dark_gray>({group})</dark_gray>
jobs.audit.external.empty={prefix} <green>No externally-granted job memberships.</green>

# ---- Administration -------------------------------------------------------
jobs.admin.reload.success={prefix} <green>Reloaded jobs.yml and messages.properties.</green>
jobs.admin.reload.failed={prefix} <red>Reload failed:</red> <gray>{error}</gray> <gray>(see console)</gray>
